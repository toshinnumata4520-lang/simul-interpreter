<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>同時通訳 JA⇄EN</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1b1f24; --muted:#6b7380; --line:#dfe3e8;
  --accent:#2563eb; --accent-text:#fff; --rec:#dc2626; --pending:#9aa3ae; --src:#5b6472;
  --dock:rgba(255,255,255,.82);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0d10; --panel:#181b21; --text:#f2f4f7; --muted:#8b93a1; --line:#2a2f38;
    --accent:#3b82f6; --rec:#ef4444; --pending:#5f6875; --src:#98a1ae; --dock:rgba(20,23,28,.82); }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Segoe UI","Yu Gothic UI","Meiryo",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* 訳文エリア：画面全体を使う */
#feed{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)
          calc(env(safe-area-inset-bottom) + var(--dock-h, 120px) + 12px) calc(env(safe-area-inset-left) + 18px)}
.para{margin:0 auto .7em;max-width:1200px;opacity:.38;transition:opacity .3s}
.para:nth-last-child(-n+2){opacity:1}
.para .src{color:var(--src);font-size:calc(var(--fs) * .42);line-height:1.45;margin-bottom:.15em}
body.nosrc .para .src{display:none}
.para .tgt{font-size:var(--fs);line-height:1.32;font-weight:600;letter-spacing:-.005em;overflow-wrap:anywhere}
.tgt span.pending::after{content:"▍";color:var(--pending);animation:blink 1s steps(1) infinite}
.tgt span.err{color:var(--rec)}
@keyframes blink{50%{opacity:0}}
#empty{color:var(--muted);text-align:center;margin-top:22vh;line-height:2;font-size:17px;overflow-wrap:anywhere}

/* 下部の操作バー（半透明） */
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--dock);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px)}
#live{height:1.5em;font-size:14px;color:var(--pending);white-space:nowrap;overflow:hidden}
#live .committed{color:var(--src)}
#bar{display:flex;align-items:center;justify-content:space-between;gap:6px;max-width:560px;margin:2px auto 0}
.ib{flex:0 1 auto;min-width:44px;height:44px;border-radius:22px;white-space:nowrap;border:1px solid var(--line);background:var(--panel);
  font-size:15px;font-weight:600;padding:0 10px;color:var(--text)}
.ib.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#startBtn{flex:0 0 62px;width:62px;height:62px;border-radius:31px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
#startBtn.on{background:var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(220,38,38,.18)}}
#statusline{display:flex;justify-content:center;gap:12px;font-size:11px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.err{color:var(--rec);white-space:normal}

/* 設定は全画面のシート */
#sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px)}
#sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 12px;
  position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:1}
.sheet-head h2{font-size:18px;margin:0}
.sheet-head button,.danger{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;font-weight:600}
.sheet-head button{background:var(--accent);color:#fff;border-color:var(--accent)}
#settings{display:grid;gap:14px;max-width:640px;margin:0 auto}
#settings label[hidden]{display:none}
#settings label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
#settings label.row{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--text)}
#settings input[type=text],#settings input[type=password],#settings input[type=number],#settings select,#settings textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-size:16px}
#settings textarea{min-height:90px;resize:vertical}
.danger{color:var(--rec);justify-self:start}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.9em}
@media (hover:none){ .kbd-hint{display:none} }
</style>
</head>
<body style="--fs:36px">
<main id="feed">
  <div id="empty">
    下の <b>●</b> を押して話し始めてください<br>
    <span class="kbd-hint"><kbd>Space</kbd> 開始/停止 ・ <kbd>D</kbd> 方向切替</span>
  </div>
</main>

<div id="dock">
  <div id="live"></div>
  <div id="bar">
    <button id="dirBtn" class="ib" title="通訳方向（D キー）">日→英</button>
    <button id="srcBtn" class="ib" title="原文の表示">原文</button>
    <button id="smallerBtn" class="ib" title="文字を小さく" aria-label="文字を小さく">A−</button>
    <button id="startBtn" title="開始/停止（スペースキー）">開始</button>
    <button id="biggerBtn" class="ib" title="文字を大きく" aria-label="文字を大きく">A＋</button>
    <button id="settingsBtn" class="ib" title="設定" aria-label="設定">⚙</button>
  </div>
  <div id="statusline">
    <span id="status">停止中</span>
    <span id="latency"></span>
    <span id="queued"></span>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-head"><h2>設定</h2><button id="closeSettings">完了</button></div>
  <section id="settings">
    <label>翻訳エンジン
      <select id="provider">
        <option value="gemini">Gemini（無料枠・回数制限あり）</option>
        <option value="claude">Claude（有料・最速）</option>
      </select></label>
    <label data-for="gemini">Gemini APIキー（この端末のブラウザ内にのみ保存）
      <input id="geminiKey" type="password" placeholder="AQ... / AIza..." autocomplete="off"></label>
    <label data-for="gemini">1分あたりの最大リクエスト数（無料枠の上限に合わせる）
      <input id="rpm" type="number" min="2" max="60" step="1"></label>
    <label data-for="claude">Anthropic APIキー（この端末のブラウザ内にのみ保存）
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off"></label>
    <label data-for="claude">翻訳モデル
      <select id="model">
        <option value="haiku">Haiku 5.5（最速・推奨）</option>
        <option value="sonnet">Sonnet 5.5（高品質・やや遅い）</option>
        <option value="opus">Opus 5.5（最高品質・遅い）</option>
      </select></label>
    <label>区切り方（速さ ⇄ 正確さ）
      <select id="speed">
        <option value="fastest">最速（細かく区切る・言い直し多め）</option>
        <option value="fast">標準（プロ通訳相当）</option>
        <option value="accurate">正確（文の切れ目まで待つ）</option>
      </select></label>
    <label>文字サイズ
      <input id="fontSize" type="range" min="18" max="96" step="2"></label>
    <label class="row"><input id="tts" type="checkbox"> 訳文を読み上げる（ヘッドホン推奨）</label>
    <label>読み上げ速度
      <input id="ttsRate" type="range" min="0.8" max="2" step="0.1"></label>
    <label>用語集（1行に1つ「原語 = 訳語」。固有名詞・専門用語の誤訳を防ぎます）
      <textarea id="glossary" placeholder="東進 = Toshin&#10;中学NET = Chugaku NET&#10;共通テスト = Common Test"></textarea></label>
    <button id="clearBtn" class="danger">表示をすべてクリア</button>
  </section>
</div>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";

// ---------- 設定 ----------
const DEFAULTS = { provider:"gemini", geminiKey:"", rpm:10, apiKey:"", model:"haiku", speed:"fast", fontSize:44, showSrc:true, tts:false, ttsRate:1.2, glossary:"", dir:"ja-en" };
const S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem("simul-settings") || "{}")); } catch {}
const save = () => { try { localStorage.setItem("simul-settings", JSON.stringify(S)); } catch {} };
// 全画面レイアウトに合わせ、以前の小さい文字サイズ設定は一度だけ新しい既定値に上げる
if (S.uiVer !== 2) { S.fontSize = innerWidth < 600 ? 34 : 44; S.uiVer = 2; save(); }

// 翻訳の待ち時間を最小にするため、思考を切るか最小にする
const MODELS = {
  haiku:  { model:"claude-haiku-5-5",  thinking:{ type:"disabled" },      output_config:{ effort:"low" } },
  sonnet: { model:"claude-sonnet-5-5", thinking:{ type:"between_tools" }, output_config:{ effort:"low" } },
  opus:   { model:"claude-opus-5-5",                                       output_config:{ effort:"low" } },
};

// Gemini 無料枠で使える最速モデル（思考は既定で最小）
const GEMINI_MODEL = "gemini-3.5-flash-lite";

// maxLen: 文の途中でも翻訳に回す長さ（日本語=文字数 / 英語=単語数）、pause: 無音とみなす間(ms)
const SPEEDS = {
  fastest:  { ja:8,  en:4, pause:280 },
  fast:     { ja:14, en:7, pause:420 },
  accurate: { ja:0,  en:0, pause:800 },
};

const $ = id => document.getElementById(id);
const ui = { provider:$("provider"), geminiKey:$("geminiKey"), rpm:$("rpm"), apiKey:$("apiKey"), model:$("model"), speed:$("speed"), fontSize:$("fontSize"),
  tts:$("tts"), ttsRate:$("ttsRate"), glossary:$("glossary") };
for (const [k, el] of Object.entries(ui)) {
  if (el.type === "checkbox") el.checked = S[k]; else el.value = S[k];
  el.addEventListener("input", () => {
    S[k] = el.type === "checkbox" ? el.checked : (el.type === "range" || el.type === "number") ? Number(el.value) : el.value;
    save(); applyUi();
  });
}
function applyUi() {
  document.body.style.setProperty("--fs", S.fontSize + "px");
  ui.fontSize.value = S.fontSize;
  $("dirBtn").textContent = S.dir === "ja-en" ? "日→英" : "英→日";
  document.body.classList.toggle("nosrc", !S.showSrc);
  $("srcBtn").classList.toggle("on", S.showSrc);
  document.body.style.setProperty("--dock-h", $("dock").offsetHeight + "px");
  for (const el of document.querySelectorAll("[data-for]")) el.hidden = el.dataset.for !== S.provider;
}
applyUi();
const activeKey = () => S.provider === "gemini" ? S.geminiKey : S.apiKey;
const openSheet = (open = true) => { $("sheet").hidden = !open; };
if (!activeKey()) openSheet();
addEventListener("resize", applyUi);

// ---------- 翻訳 ----------
let client = null;
function getClient() {
  if (!client || client.apiKey !== S.apiKey)
    client = new Anthropic({ apiKey: S.apiKey, dangerouslyAllowBrowser: true, maxRetries: 1 });
  return client;
}

function systemPrompt() {
  const [src, tgt] = S.dir === "ja-en" ? ["Japanese", "English"] : ["English", "Japanese"];
  const gloss = S.glossary.trim() ? `\n\nGlossary (always use these renderings):\n${S.glossary.trim()}` : "";
  return `You are a professional booth simultaneous interpreter working from ${src} into ${tgt}.
Speech-recognition text arrives in short fragments while the speaker is still talking. Each request gives you the recent fragments with your earlier output, then one NEW fragment.

Translate ONLY the new fragment so that it continues naturally from your earlier output, the way a simultaneous interpreter speaks:
- Output the ${tgt} rendering only. No quotes, notes, labels, or explanations.
- The fragment may stop mid-sentence. Render what can be said now ("salami technique"); do not invent the rest and do not repeat what was already rendered.
- Keep it concise and spoken. Drop fillers and hesitations (えー, あの, um, you know). If the fragment is only filler, output nothing.
- Silently fix obvious speech-recognition errors using context.
- ${tgt === "Japanese" ? "Use natural polite spoken Japanese (です・ます)." : "Use natural spoken English."}${gloss}`;
}

// 翻訳1回分 = unit。Gemini の無料枠では、待っている間に溜まった区切りを1回にまとめて送る
const units = [];    // {src, tgt, done, span, t0}
let queue = [];      // まだ送っていない区切り {src, para, t0}
const sentAt = [];   // 直近1分の送信時刻
let dispatchTimer = null;
const latencies = [];

function buildPrompt(idx) {
  const ctx = units.slice(Math.max(0, idx - 8), idx).map(c =>
    `SRC: ${c.src}\nOUT: ${c.done ? (c.tgt.trim() || "(nothing)") : "(being translated in parallel)"}`).join("\n");
  return (ctx ? `<recent>\n${ctx}\n</recent>\n\n` : "") + `<new_fragment>${units[idx].src}</new_fragment>`;
}

function rateWait() {
  if (S.provider !== "gemini") return 0;
  const now = performance.now();
  while (sentAt.length && now - sentAt[0] > 60000) sentAt.shift();
  return sentAt.length < Math.max(1, S.rpm) ? 0 : sentAt[0] + 60000 - now + 50;
}

function dispatch() {
  clearTimeout(dispatchTimer);
  while (queue.length) {
    const wait = rateWait();
    if (wait > 0) {
      dispatchTimer = setTimeout(dispatch, wait);
      $("queued").textContent = `無料枠の上限待ち: ${queue.length}件`;
      return;
    }
    const group = S.provider === "gemini" ? queue.splice(0) : [queue.shift()];
    const span = document.createElement("span"); span.className = "pending";
    group[0].para.tgt.append(span);
    const sep = S.dir === "ja-en" ? "" : " ";
    units.push({ src: group.map(g => g.src).join(sep), tgt: "", done: false, span, t0: group[0].t0 });
    sentAt.push(performance.now());
    translate(units.length - 1);
  }
  $("queued").textContent = "";
}

async function* streamClaude(system, prompt) {
  const stream = getClient().messages.stream({
    ...MODELS[S.model],
    max_tokens: 400,
    system,
    messages: [{ role: "user", content: prompt }],
  });
  for await (const ev of stream)
    if (ev.type === "content_block_delta" && ev.delta.type === "text_delta") yield ev.delta.text;
  const msg = await stream.finalMessage();
  if (msg.stop_reason === "refusal") throw new Error("refusal");
}

class RateLimitError extends Error {}
async function* streamGemini(system, prompt) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:streamGenerateContent?alt=sse`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": S.geminiKey },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: "user", parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 400 },
    }),
  });
  if (res.status === 429) throw new RateLimitError();
  if (!res.ok) throw new Error(`${res.status} ${(await res.text()).slice(0, 300)}`);
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) continue;
      let data; try { data = JSON.parse(line.slice(5)); } catch { continue; }
      for (const p of data.candidates?.[0]?.content?.parts || [])
        if (p.text && !p.thought) yield p.text;
    }
  }
}

async function translate(idx) {
  const c = units[idx];
  const sep = S.dir === "ja-en" ? " " : "";
  if (!activeKey()) { c.span.textContent = "（APIキー未設定）"; c.span.className = "err"; c.done = true; return; }
  let first = true;
  try {
    const gen = S.provider === "gemini" ? streamGemini(systemPrompt(), buildPrompt(idx)) : streamClaude(systemPrompt(), buildPrompt(idx));
    for await (const text of gen) {
      if (first) { first = false; recordLatency(performance.now() - c.t0); }
      c.tgt += text;
      c.span.textContent = c.tgt.trim() + sep;
    }
  } catch (e) {
    if (e?.message === "refusal") { c.tgt = ""; c.span.textContent = ""; }
    else {
      c.span.textContent = "⚠ ";
      c.span.className = "err";
      setStatus(e instanceof RateLimitError
        ? "Gemini 無料枠の上限に達しました。少し待つか、設定の「1分あたりの最大リクエスト数」を下げてください（1日の上限の場合は日本時間の夕方16〜17時頃に回復）"
        : "翻訳エラー: " + (e?.message || e), true);
    }
  }
  c.done = true;
  c.span.classList.remove("pending");
  flushSpeech();
}

function recordLatency(ms) {
  latencies.push(ms);
  if (latencies.length > 30) latencies.shift();
  const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
  $("latency").textContent = `区切り→訳の表示: 直近 ${(ms / 1000).toFixed(1)}秒 / 平均 ${(avg / 1000).toFixed(1)}秒`;
}

// ---------- 読み上げ（順番を守る） ----------
let speakPtr = 0;
function flushSpeech() {
  while (speakPtr < units.length && units[speakPtr].done) {
    const c = units[speakPtr++];
    if (!S.tts || !c.tgt.trim() || !("speechSynthesis" in window)) continue;
    const u = new SpeechSynthesisUtterance(c.tgt.trim());
    u.lang = S.dir === "ja-en" ? "en-US" : "ja-JP";
    u.rate = S.ttsRate;
    speechSynthesis.speak(u);
  }
}

// ---------- 表示 ----------
const feed = $("feed");
let para = null;
function newPara() {
  $("empty")?.remove();
  const p = document.createElement("div"); p.className = "para";
  const src = document.createElement("div"); src.className = "src";
  const tgt = document.createElement("div"); tgt.className = "tgt";
  p.append(src, tgt); feed.append(p);
  return { src, tgt };
}
function scrollDown() {
  if (feed.scrollHeight - feed.scrollTop - feed.clientHeight < 400) feed.scrollTop = feed.scrollHeight;
}
const hasContent = s => /[\p{L}\p{N}]/u.test(s);

function commit(src) {
  src = src.trim();
  if (!hasContent(src)) return;
  if (!para) para = newPara();
  const s = document.createElement("span");
  s.textContent = src + (S.dir === "en-ja" ? " " : "");
  para.src.append(s);
  queue.push({ src, para, t0: performance.now() });
  dispatch();
  scrollDown();
}
const endPara = () => { para = null; };

// ---------- 音声認識と区切り ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, running = false;
let committed = {}, prevText = {}, pauseTimer = null;

const measure = s => S.dir === "ja-en" ? s.replace(/\s/g, "").length : s.trim().split(/\s+/).filter(Boolean).length;

// 安定している（直前の認識結果と一致する）範囲の中で、区切りの良い位置を探す
function findCut(t, c, stable) {
  if (S.dir === "en-ja") {
    const idx = t.lastIndexOf(" ", stable - 1);   // 最後の単語は伸びる途中かもしれないので除く
    return idx > c ? idx + 1 : c;
  }
  // 日本語は単語の途中で切らないよう形態素の切れ目を使い、助詞・文末の直後を優先する
  const limit = stable - 1;
  let best = c, lastWord = c;
  for (const seg of jaSegmenter.segment(t.slice(0, limit))) {
    const end = seg.index + seg.segment.length;
    if (end >= limit || end <= c + 3) continue;   // 最後の語は伸びる途中かもしれないので除く
    lastWord = end;
    if (JA_BREAK.test(seg.segment)) best = end;
  }
  if (best > c) return best;
  return measure(t.slice(c, limit)) >= SPEEDS[S.speed].ja * 1.5 ? lastWord : c;
}
const jaSegmenter = new Intl.Segmenter("ja", { granularity: "word" });
const JA_BREAK = /^(?:[、。，,？！?!]|は|が|を|に|で|と|も|へ|や|から|まで|けど|ので|のに|ため|て|について|として|いただき|ながら|ます|です|ました|でした|ません|ください)$/;

function handleInterim(i, t) {
  if ((committed[i] || 0) > t.length) committed[i] = t.length;
  const c = committed[i] || 0;
  const prev = prevText[i] || "";
  prevText[i] = t;
  const P = SPEEDS[S.speed], maxLen = S.dir === "ja-en" ? P.ja : P.en;
  if (maxLen && measure(t.slice(c)) >= maxLen) {
    let stable = 0;
    while (stable < prev.length && stable < t.length && prev[stable] === t[stable]) stable++;
    const cut = findCut(t, c, stable);
    if (cut > c) { commit(t.slice(c, cut)); committed[i] = cut; }
  }
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => {
    const txt = prevText[i] || "", cc = committed[i] || 0;
    if (hasContent(txt.slice(cc))) { commit(txt.slice(cc)); committed[i] = txt.length; }
  }, P.pause);
}

function renderLive(e) {
  const live = $("live"); live.textContent = "";
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const r = e.results[i];
    if (r.isFinal) continue;
    const t = r[0].transcript, c = Math.min(committed[i] || 0, t.length);
    const a = document.createElement("span"); a.className = "committed"; a.textContent = t.slice(0, c);
    const b = document.createElement("span"); b.textContent = t.slice(c);
    live.append(a, b);
  }
  live.scrollLeft = live.scrollWidth;   // 一行に収まらないときは最新の部分を見せる
}

function startRec() {
  if (!SR) { setStatus("このブラウザは音声認識に対応していません。Safari / Edge / Chrome で開いてください。", true); return; }
  committed = {}; prevText = {};
  rec = new SR();
  rec.lang = S.dir === "ja-en" ? "ja-JP" : "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => { committed = {}; prevText = {}; setStatus(`🎙 聞き取り中（${rec.lang}）`); };
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i], t = r[0].transcript;
      if (r.isFinal) {
        clearTimeout(pauseTimer);
        const c = Math.min(committed[i] || 0, t.length);
        commit(t.slice(c));
        committed[i] = t.length;
        endPara();
      } else handleInterim(i, t);
    }
    renderLive(e);
  };
  rec.onerror = e => {
    if (e.error === "not-allowed") { setStatus("マイクの使用が許可されていません", true); stop(); }
    else if (e.error !== "no-speech" && e.error !== "aborted") setStatus("音声認識エラー: " + e.error, true);
  };
  // 連続認識はブラウザ側で定期的に切れるので自動で再開する
  // iPhone は再開を拒むことがあるので、その場合はタップでの再開を促す
  rec.onend = () => {
    if (!running || !rec) return;
    try { rec.start(); } catch { setStatus("聞き取りが止まりました。停止 → 開始 で再開してください", true); }
  };
  rec.start();
}

function start() {
  if (!activeKey()) { openSheet(); (S.provider === "gemini" ? ui.geminiKey : ui.apiKey).focus(); setStatus("APIキーを入力してください", true); return; }
  running = true;
  $("startBtn").textContent = "停止"; $("startBtn").classList.add("on");
  // iPhone は読み上げをタップ操作の中で一度鳴らさないと、以後の読み上げが無音になる
  if (S.tts && "speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  // 通訳中に画面が消えると聞き取りが止まるので、スリープを防ぐ
  navigator.wakeLock?.request("screen").then(l => { wakeLock = l; }).catch(() => {});
  startRec();
}
let wakeLock = null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running)
    navigator.wakeLock?.request("screen").then(l => { wakeLock = l; }).catch(() => {});
});
function stop() {
  running = false;
  clearTimeout(pauseTimer);
  const r = rec; rec = null;
  try { r?.stop(); } catch {}
  wakeLock?.release().catch(() => {}); wakeLock = null;
  $("startBtn").textContent = "開始"; $("startBtn").classList.remove("on");
  $("live").textContent = "";
  endPara();
  setStatus("停止中");
}
function swapDir() {
  S.dir = S.dir === "ja-en" ? "en-ja" : "ja-en"; save(); applyUi(); endPara();
  if (running) { const r = rec; rec = null; try { r?.abort(); } catch {} startRec(); }
}
function setStatus(s, isErr = false) {
  $("status").textContent = s;
  $("status").classList.toggle("err", isErr);
  document.body.style.setProperty("--dock-h", $("dock").offsetHeight + "px");
}

$("startBtn").onclick = () => running ? stop() : start();
$("dirBtn").onclick = swapDir;
$("settingsBtn").onclick = () => openSheet();
$("closeSettings").onclick = () => openSheet(false);
$("srcBtn").onclick = () => { S.showSrc = !S.showSrc; save(); applyUi(); };
const resize = d => { S.fontSize = Math.min(96, Math.max(18, S.fontSize + d)); save(); applyUi(); scrollDown(); };
$("smallerBtn").onclick = () => resize(-4);
$("biggerBtn").onclick = () => resize(4);
$("clearBtn").onclick = () => {
  feed.textContent = ""; units.length = 0; queue = []; speakPtr = 0; endPara();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  openSheet(false);
};
document.addEventListener("keydown", e => {
  if (e.target.closest?.("input,textarea,select") || !$("sheet").hidden) return;
  if (e.code === "Space") { e.preventDefault(); running ? stop() : start(); }
  else if (e.key === "d" || e.key === "D") swapDir();
});
</script>
</body>
</html>
